spring.application.name=student-planner

# H2 in-memory database (no install needed)
spring.datasource.url=jdbc:h2:file:./data/studentplanner;AUTO_SERVER=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# JWT
jwt.secret=change-me-to-a-long-random-secret-at-least-32-chars
jwt.expiration-ms=86400000

# Server
server.port=8080

# CORS – override via CORS_ALLOWED_ORIGINS env var in production (Railway)
# Default covers: Vite dev server and Docker Compose nginx frontend
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}
