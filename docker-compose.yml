services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    volumes:
      - backend_data:/app/data
    environment:
      - SPRING_DATASOURCE_URL=jdbc:h2:file:/app/data/studentplanner;AUTO_SERVER=TRUE
      # Allow requests from the frontend container (nginx proxies /api/ on port 5173)
      - CORS_ALLOWED_ORIGINS=http://localhost:5173
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        # Empty: nginx proxies /api/ to the backend container in local Docker Compose
        - VITE_API_URL=
    ports:
      - "5173:8080"
    environment:
      # nginx resolves "backend" via Docker Compose internal DNS
      - BACKEND_HOST=backend
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  backend_data:
